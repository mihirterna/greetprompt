# Deploys the frontend to the Cloudflare Pages project (cloudflare-wishes /
# greetprompt.com) on pushes to main that touch frontend/**. Direct-upload
# project (not Git-connected), so this workflow is the deploy automation.
#
# Skipped until enabled, mirroring deploy-backend.yml:
#   gh variable set CLOUDFLARE_PAGES_DEPLOY_ENABLED --body true --repo mihirterna/greetprompt
name: Deploy frontend (Pages)

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/deploy-frontend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy cloudflare-wishes (Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: vars.CLOUDFLARE_PAGES_DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build (vite + prerendered landing pages)
        working-directory: frontend
        run: npm run build
      - name: Verify prerendered SEO output
        working-directory: frontend
        run: node scripts/verifyBuild.js
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=cloudflare-wishes --branch main --commit-dirty=true
