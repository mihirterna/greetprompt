<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070A10" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9D2" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="goldCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="sparkleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Subtle Outer Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#goldBorder)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Ambient Golden Glow -->
  <circle cx="256" cy="246" r="140" fill="#F59E0B" opacity="0.16" filter="url(#glow)" />

  <!-- Stylized Luxury Greeting Card -->
  <g transform="translate(256,256) rotate(-8) translate(-256,-256)">
    <!-- Back card offset -->
    <rect x="156" y="146" width="200" height="250" rx="20" fill="#1E293B" stroke="url(#goldBorder)" stroke-width="2.5" opacity="0.6" />
  </g>

  <!-- Main Card -->
  <rect x="146" y="136" width="220" height="268" rx="24" fill="#0B132B" stroke="url(#goldCard)" stroke-width="5" filter="url(#glow)" />
  
  <!-- Inner Border Line -->
  <rect x="162" y="152" width="188" height="236" rx="16" fill="none" stroke="url(#goldBorder)" stroke-width="1.8" stroke-dasharray="6,4" stroke-opacity="0.8" />

  <!-- GreetPrompt Luxury Monogram / Starburst -->
  <!-- 4-point Main Sparkle Star -->
  <path d="M 256 186 C 256 222, 272 238, 308 238 C 272 238, 256 254, 256 290 C 256 254, 240 238, 204 238 C 240 238, 256 222, 256 186 Z"
        fill="url(#goldBorder)"
        filter="url(#sparkleGlow)" />

  <!-- Small diagonal accent sparkles -->
  <circle cx="298" cy="198" r="7" fill="#FFF9D2" filter="url(#glow)" />
  <circle cx="214" cy="278" r="5" fill="#FCD34D" filter="url(#glow)" />
  <circle cx="304" cy="282" r="4" fill="#F59E0B" />

  <!-- Elegant Decorative Horizontal Divider with Central Diamond -->
  <line x1="184" y1="316" x2="242" y2="316" stroke="url(#goldBorder)" stroke-width="2" stroke-linecap="round" />
  <polygon points="256,311 261,316 256,321 251,316" fill="#FFF9D2" />
  <line x1="270" y1="316" x2="328" y2="316" stroke="url(#goldBorder)" stroke-width="2" stroke-linecap="round" />

  <!-- Card Emblem Subtitle Bars -->
  <rect x="200" y="338" width="112" height="6" rx="3" fill="url(#goldBorder)" opacity="0.9" />
  <rect x="224" y="354" width="64" height="4" rx="2" fill="url(#goldBorder)" opacity="0.6" />
</svg>
